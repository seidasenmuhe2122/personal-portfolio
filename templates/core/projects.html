{% extends 'base.html' %}{% block title %}Projects · {{ site.site_name }}{% endblock %}{% block content %}<section class="page-head"><span class="eyebrow">PORTFOLIO</span><h1>Projects</h1></section><section class="section"><div class="grid">{% for p in projects %}<article class="card"><div class="card-tag">{{ p.technologies }}</div><h3>{{ p.title }}</h3><p>{{ p.summary }}</p><a href="{% url 'project_detail' p.slug %}">View project →</a></article>{% empty %}<p>No projects published yet.</p>{% endfor %}</div></section>{% endblock %}
