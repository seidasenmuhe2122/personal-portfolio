{% if certificates %}<section class="section"><div class="section-head"><span class="eyebrow">{{ section.title|default:'CREDENTIALS' }}</span><h2>{{ section.subtitle|default:'Learning that compounds.' }}</h2></div><div class="cert-grid">{% for c in certificates %}<article class="cert-card"><div class="cert-seal">✓</div><div><b>{{ c.title }}</b><span>{{ c.issuer }}</span><small>{{ c.issue_date|date:'M Y' }}</small></div></article>{% endfor %}</div></section>{% endif %}
