{% if testimonials %}<section class="section"><div class="section-head"><span class="eyebrow">{{ section.title|default:'TRUST' }}</span><h2>{{ section.subtitle|default:'What people say.' }}</h2></div><div class="testimonial-grid">{% for t in testimonials %}<article class="testimonial"><div class="quote">“</div><p>{{ t.quote }}</p><b>{{ t.name }}</b><small>{{ t.role }}{% if t.company %} · {{ t.company }}{% endif %}</small></article>{% endfor %}</div></section>{% endif %}
