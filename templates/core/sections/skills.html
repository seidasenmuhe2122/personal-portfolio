{% if skills %}<section class="section skills-section"><div class="section-head"><span class="eyebrow">{{ section.title|default:'TOOLKIT' }}</span><h2>{{ section.subtitle|default:'Skills & technologies.' }}</h2></div><div class="skills-modern">{% for s in skills %}<div class="skill-modern"><div><span>{{ s.name }}</span><b>{{ s.level }}%</b></div><div class="bar"><i style="width:{{ s.level }}%"></i></div><small>{{ s.category|default:'Core capability' }}</small></div>{% endfor %}</div></section>{% endif %}
