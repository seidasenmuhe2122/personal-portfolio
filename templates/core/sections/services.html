{% if services %}<section class="section dark-band"><div class="section-head"><span class="eyebrow">{{ section.title|default:'CAPABILITIES' }}</span><h2>{{ section.subtitle|default:'What I can build with you.' }}</h2></div><div class="service-grid">{% for s in services %}<article class="service-card"><div class="service-icon">{{ s.icon|default:'✦' }}</div><span>0{{ forloop.counter }}</span><h3>{{ s.title }}</h3><p>{{ s.summary }}</p><a href="{% url 'services' %}">Discover →</a></article>{% endfor %}</div></section>{% endif %}
